<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Spanish Master Deck</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lora:wght@500;600&display=swap');
    :root {
      color-scheme: light dark;
      --bg: #f6f4ee; --surface: #fffdf8; --surface-2: #ede8dd; --ink: #202827;
      --muted: #596461; --line: #cfc8ba; --accent: #c64f34; --accent-ink: #fffaf5;
      --teal: #176c68; --teal-soft: #d9ebe7; --focus: #0b6fbc; --shadow: 0 16px 40px rgba(44,38,31,.12);
      --radius-card: 26px; --radius-ui: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151a19; --surface: #202725; --surface-2: #2a322f; --ink: #f3f0e8;
        --muted: #bac5c1; --line: #48514d; --accent: #ee765a; --accent-ink: #1e1715;
        --teal: #79ccc2; --teal-soft: #183c39; --focus: #7fc6ff; --shadow: 0 18px 50px rgba(0,0,0,.28);
      }
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100%; color: var(--ink); background: var(--bg);
      font-family: "Atkinson Hyperlegible", sans-serif; line-height: 1.45;
      -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .app { width: min(100%, 980px); margin: 0 auto; padding: 24px clamp(16px, 4vw, 44px) 42px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    h1 { margin: 0; font-family: Lora, serif; font-size: clamp(28px, 5vw, 44px); line-height: 1.08; letter-spacing: -.03em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 17px; }
    .session { min-width: 156px; text-align: right; color: var(--muted); }
    .session strong { color: var(--ink); font-size: 23px; display: block; line-height: 1; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 12px; }
    .tab {
      min-height: 52px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: var(--radius-ui); cursor: pointer; padding: 8px 10px; font-weight: 700; line-height: 1.1;
    }
    .tab small { display: block; color: var(--muted); margin-top: 4px; font-weight: 400; }
    .tab[aria-selected="true"] { background: var(--teal); color: var(--accent-ink); border-color: var(--teal); }
    .tab[aria-selected="true"] small { color: inherit; opacity: .82; }
    .tools { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 10px; margin-bottom: 14px; }
    .field { position: relative; }
    .field svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    input, select {
      width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: var(--radius-ui); padding: 10px 13px;
    }
    input { padding-left: 40px; }
    .shuffle { min-height: 48px; border: 1px solid var(--line); border-radius: var(--radius-ui); background: var(--surface-2); color: var(--ink); padding: 0 16px; cursor: pointer; font-weight: 700; }
    .progress { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 0 0 14px; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
    .stage { min-height: 470px; display: grid; place-items: center; perspective: 1200px; }
    .card {
      width: 100%; min-height: 440px; border: 0; background: transparent; padding: 0; cursor: pointer; position: relative;
      transform-style: preserve-3d; transition: transform .48s cubic-bezier(.2,.7,.2,1); color: var(--ink); text-align: left;
    }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow);
      padding: clamp(22px, 5vw, 40px); display: flex; flex-direction: column;
    }
    .back { transform: rotateY(180deg); overflow: auto; }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .deck-label { color: var(--accent); font-weight: 700; }
    .position { color: var(--muted); font-variant-numeric: tabular-nums; }
    .word-wrap { flex: 1; display: grid; place-content: center; text-align: center; padding: 30px 0; }
    .word { font-family: Lora, serif; font-size: clamp(38px, 8vw, 72px); line-height: 1.08; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
    .phrase-word { font-size: clamp(31px, 6vw, 58px); }
    .hint { margin: 18px auto 0; color: var(--muted); text-align: center; border: 0; background: transparent; cursor: pointer; padding: 7px 10px; }
    .audio-row { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    .audio-btn {
      border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); min-height: 44px; border-radius: 99px;
      padding: 8px 15px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
    }
    .audio-btn svg { width: 18px; height: 18px; }
    .back .meaning { font-family: Lora, serif; font-size: clamp(29px, 5vw, 48px); line-height: 1.1; margin: 24px 0 8px; text-align: center; }
    .spanish-back { text-align: center; color: var(--teal); font-size: 20px; margin: 0 0 18px; }
    .details { width: 100%; margin: auto 0; }
    .note, .example {
      margin: 14px auto 0; max-width: 660px; background: var(--teal-soft); border-radius: 14px; padding: 14px 16px;
      color: var(--ink);
    }
    .example strong { display: block; color: var(--teal); margin-bottom: 3px; }
    .forms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 16px 0; }
    .form-cell { background: var(--surface-2); padding: 10px; border-radius: 10px; text-align: center; }
    .form-cell small { display: block; color: var(--muted); }
    .conjugations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 4px; }
    .tense { background: var(--surface-2); border-radius: 14px; padding: 13px; }
    .tense h3 { margin: 0 0 8px; color: var(--accent); font-size: 16px; }
    .tense ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; }
    .tense li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .pronoun { color: var(--muted); }
    .word-link { border: 0; padding: 1px 2px; background: transparent; color: var(--teal); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; font: inherit; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .action { min-height: 58px; border-radius: 15px; cursor: pointer; font-weight: 700; border: 1px solid var(--line); font-size: 17px; }
    .again { background: var(--surface); color: var(--ink); }
    .got { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .empty { width: 100%; padding: 54px 24px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .empty h2 { font-family: Lora, serif; margin: 0 0 8px; font-size: 30px; }
    .empty p { color: var(--muted); margin: 0 auto 20px; }
    .reset { border: 0; border-radius: 11px; background: var(--teal); color: var(--accent-ink); font-weight: 700; padding: 12px 18px; cursor: pointer; }
    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 18px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 10px 16px; font-weight: 700; transition: .2s ease; z-index: 10; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 680px) {
      .app { padding-top: 18px; }
      .intro { align-items: start; margin-bottom: 16px; }
      .session { min-width: 110px; }
      .session strong { font-size: 20px; }
      .tabs { grid-template-columns: 1fr 1fr; }
      .tools { grid-template-columns: 1fr auto; }
      .tools .category { grid-column: 1 / -1; grid-row: 2; }
      .stage { min-height: 520px; }
      .card { min-height: 500px; }
      .face { padding: 22px 19px; }
      .conjugations { grid-template-columns: 1fr; }
      .back .meaning { margin-top: 14px; }
      .forms { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 390px) {
      .intro { display: block; }
      .session { text-align: left; margin-top: 10px; }
      .session strong { display: inline; margin-right: 4px; }
      .stage { min-height: 540px; }
      .card { min-height: 520px; }
      .tab { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="intro" aria-labelledby="deck-title">
      <div>
        <h1 id="deck-title">1,214 Spanish cards</h1>
        <p class="subtitle">Tap a card to reveal the meaning. Tap linked words to explore.</p>
      </div>
      <div class="session" aria-live="polite"><strong id="learnedCount">0 learned</strong><span>this session</span></div>
    </section>

    <nav class="tabs" aria-label="Choose a deck" role="tablist">
      <button class="tab" type="button" data-deck="phrases" role="tab" aria-selected="true">Phrases<small>514 cards</small></button>
      <button class="tab" type="button" data-deck="verbs" role="tab" aria-selected="false">Verbs<small>100 cards</small></button>
      <button class="tab" type="button" data-deck="adjectives" role="tab" aria-selected="false">Adjectives<small>100 cards</small></button>
      <button class="tab" type="button" data-deck="nouns" role="tab" aria-selected="false">Nouns<small>500 cards</small></button>
    </nav>

    <section class="tools" aria-label="Deck tools">
      <label class="field">
        <span class="sr-only" hidden>Search cards</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="search" type="search" placeholder="Search Spanish or English" aria-label="Search Spanish or English" autocomplete="off">
      </label>
      <select id="category" class="category" aria-label="Filter by category"></select>
      <button id="shuffle" class="shuffle" type="button" aria-label="Shuffle current deck">Shuffle</button>
    </section>

    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <section id="stage" class="stage" aria-live="polite"></section>
    <section id="actions" class="actions" aria-label="Study actions">
      <button id="again" class="action again" type="button">Again</button>
      <button id="got" class="action got" type="button">Got it</button>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
  const DECKS = {"phrases":[{"category":"Greetings","categoryOrder":1,"english":"Hello","id":1,"isCustom":false,"note":"Use all day. Warm and universal.","position":1,"pronunciation":"OH-lah","spanish":"Hola","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"Good morning","id":2,"isCustom":false,"note":"Until noon. Always with a smile.","position":2,"pronunciation":"BWEH-nos DEE-ahs","spanish":"Buenos días","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"Good afternoon","id":3,"isCustom":false,"note":"From noon until dark.","position":3,"pronunciation":"BWEH-nas TAR-des","spanish":"Buenas tardes","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"Good evening / Good night","id":4,"isCustom":false,"note":"Both hello and goodbye at night.","position":4,"pronunciation":"BWEH-nas NO-ches","spanish":"Buenas noches","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"How are you?","id":5,"isCustom":false,"note":"With friends. Hola, ¿cómo estás?","position":5,"pronunciation":"KOH-moh es-TAHS","spanish":"¿Cómo estás?","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"Very well, thank you","id":6,"isCustom":false,"note":"Safest answer. Add ¿y tú?","position":6,"pronunciation":"mwee bee-EN, GRAH-see-ahs","spanish":"Muy bien, gracias","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"And you?","id":7,"isCustom":false,"note":"Tú = friend, usted = elder/formal.","position":7,"pronunciation":"ee TOO? / ee oos-TED?","spanish":"¿Y tú? ¿Y usted?","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"Nice to meet you","id":8,"isCustom":false,"note":"Say it with a handshake.","position":8,"pronunciation":"MOO-cho GOOS-toh","spanish":"Mucho gusto","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"See you later","id":9,"isCustom":false,"note":"Most common goodbye.","position":9,"pronunciation":"AHS-tah LWEH-goh","spanish":"Hasta luego","status":"known"},{"category":"Greetings","categoryOrder":1,"english":"Have a nice day","id":10,"isCustom":false,"note":"Lovely with shopkeepers.","position":10,"pronunciation":"keh TEN-gahs oon bwen DEE-ah","spanish":"Que tengas un buen día","status":"learning"},{"category":"Introducing Yourself","categoryOrder":2,"english":"My name is Benjamin","id":11,"isCustom":false,"note":"Literally: I call myself...","position":11,"pronunciation":"meh YAH-moh","spanish":"Me llamo Benjamin","status":"known"},{"category":"Introducing Yourself","categoryOrder":2,"english":"I'm from the United States","id":12,"isCustom":false,"note":"Soy de... works for any place.","position":12,"pronunciation":"soy deh es-TAH-dos oo-NEE-dos","spanish":"Soy de Estados Unidos","status":"learning"},{"category":"Introducing Yourself","categoryOrder":2,"english":"I live in Cuernavaca","id":13,"isCustom":false,"note":"Instant local connection.","position":13,"pronunciation":"VEE-voh en kwer-nah-VAH-kah","spanish":"Vivo en Cuernavaca","status":"learning"},{"category":"Introducing Yourself","categoryOrder":2,"english":"I'm learning Spanish","id":14,"isCustom":false,"note":"People will slow down for you.","position":14,"pronunciation":"es-TOY ah-pren-dee-EN-doh es-pah-NYOL","spanish":"Estoy aprendiendo español","status":"known"},{"category":"Introducing Yourself","categoryOrder":2,"english":"Do you speak English?","id":15,"isCustom":false,"note":"Ask after trying Spanish first.","position":15,"pronunciation":"AH-blahs een-GLES","spanish":"¿Hablas inglés?","status":"known"},{"category":"Introducing Yourself","categoryOrder":2,"english":"I speak a little Spanish","id":16,"isCustom":false,"note":"Honest and disarming.","position":16,"pronunciation":"AH-bloh oon POH-koh deh es-pah-NYOL","spanish":"Hablo un poco de español","status":"learning"},{"category":"Introducing Yourself","categoryOrder":2,"english":"I don't understand","id":17,"isCustom":false,"note":"No shame in saying it.","position":17,"pronunciation":"no en-tee-EN-doh","spanish":"No entiendo","status":"known"},{"category":"Introducing Yourself","categoryOrder":2,"english":"Can you repeat, please?","id":18,"isCustom":false,"note":"Your most useful phrase.","position":18,"pronunciation":"PWEH-des reh-peh-TEER por fah-VOR","spanish":"¿Puedes repetir, por favor?","status":"learning"},{"category":"Introducing Yourself","categoryOrder":2,"english":"Slower, please","id":19,"isCustom":false,"note":"Pair with a smile.","position":19,"pronunciation":"mahs des-PAH-see-oh por fah-VOR","spanish":"Más despacio, por favor","status":"learning"},{"category":"Introducing Yourself","categoryOrder":2,"english":"How do you say ___ in Spanish?","id":20,"isCustom":false,"note":"Point and fill the blank.","position":20,"pronunciation":"KOH-moh seh DEE-seh ___ en es-pah-NYOL","spanish":"¿Cómo se dice ___ en español?","status":"known"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"Where is downtown?","id":21,"isCustom":false,"note":"El centro is the heart of Cuerna.","position":21,"pronunciation":"DON-deh es-TAH el SEN-troh","spanish":"¿Dónde está el centro?","status":"known"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"How do I get to...?","id":22,"isCustom":false,"note":"Add place: ¿Cómo llego al zócalo?","position":22,"pronunciation":"KOH-moh YEH-goh ah","spanish":"¿Cómo llego a...?","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"It's near. It's far.","id":23,"isCustom":false,"note":"In Cuerna, lejos often means uphill.","position":23,"pronunciation":"es-TAH SER-kah. es-TAH LEH-hos.","spanish":"Está cerca. Está lejos.","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"To the right / To the left","id":24,"isCustom":false,"note":"For taxis and walking.","position":24,"pronunciation":"ah lah deh-REH-chah / ah lah ees-kee-ER-dah","spanish":"A la derecha / A la izquierda","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"Straight ahead","id":25,"isCustom":false,"note":"Driver shorthand.","position":25,"pronunciation":"TOH-doh deh-REH-choh","spanish":"Todo derecho","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"How much is the bus / ruta?","id":26,"isCustom":false,"note":"Ruta is the local combi-bus.","position":26,"pronunciation":"KWAN-toh KWES-tah el kah-mee-ON","spanish":"¿Cuánto cuesta el camión?","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"Can you take me to this address?","id":27,"isCustom":false,"note":"Show it on your phone.","position":27,"pronunciation":"meh YEH-vahs ah ES-tah dee-rek-see-ON","spanish":"¿Me llevas a esta dirección?","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"Here, please / Stop here","id":28,"isCustom":false,"note":"To get off or stop a taxi.","position":28,"pronunciation":"ah-KEE por fah-VOR","spanish":"Aquí, por favor","status":"known"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"What time does the bus pass?","id":29,"isCustom":false,"note":"Rutas are frequent but informal.","position":29,"pronunciation":"ah keh OH-rah PAH-sah lah ROO-tah","spanish":"¿A qué hora pasa la ruta?","status":"learning"},{"category":"Getting Around Cuernavaca","categoryOrder":3,"english":"I'm going downtown","id":30,"isCustom":false,"note":"Drivers and ruta helpers ask this.","position":30,"pronunciation":"voy al SEN-troh","spanish":"Voy al centro","status":"learning"},{"category":"Market","categoryOrder":4,"english":"How much does it cost?","id":31,"isCustom":false,"note":"The #1 market phrase.","position":31,"pronunciation":"KWAN-toh KWES-tah","spanish":"¿Cuánto cuesta?","status":"known"},{"category":"Market","categoryOrder":4,"english":"Do you have mangos?","id":32,"isCustom":false,"note":"¿Tienes...? for anything.","position":32,"pronunciation":"tee-EH-  TOH-doh","spanish":"Gracias, es todo","status":"learning"},{"category":"Food","categoryOrder":5,"english":"I'm hungry. I'm thirsty.","id":41,"isCustom":false,"note":"Sed is pronounced 'sed'.","position":41,"pronunciation":"TEN-goh AHM-breh. TEN-goh sed.","spanish":"Tengo hambre. Tengo sed.","status":"learning"},{"category":"Food","categoryOrder":5,"english":"What do you recommend?","id":42,"isCustom":false,"note":"Best way to find house specialty.","position":42,"pronunciation":"keh meh reh-koh-mee-EN-dahs","spanish":"¿Qué me recomiendas?","status":"learning"},{"category":"Food","categoryOrder":5,"english":"I would like two tacos al pastor","id":43,"isCustom":false,"note":"Quisiera is polite 'I would like'.","position":43,"pronunciation":"kee-see-EH-rah dos TAH-kos al pas-TOR","spanish":"Quisiera dos tacos al pastor","status":"learning"},{"category":"Food","categoryOrder":5,"english":"No spicy, please","id":44,"isCustom":false,"note":"Important: salsa can be very hot.","position":44,"pronunciation":"seen pee-KAHN-teh por fah-VOR","spanish":"Sin picante, por favor","status":"learning"},{"category":"Food","categoryOrder":5,"english":"Just a little spicy","id":45,"isCustom":false,"note":"Poquito = tiny bit, very Mexican.","position":45,"pronunciation":"poh-KEE-toh pee-KAHN-teh","spanish":"Poquito picante","status":"learning"},{"category":"Food","categoryOrder":5,"english":"To go / For here","id":46,"isCustom":false,"note":"Asked at every taquería.","position":46,"pronunciation":"PAH-rah yeh-VAHR / PAH-rah ah-KEE","spanish":"Para llevar / Para aquí","status":"learning"},{"category":"Food","categoryOrder":5,"english":"The check, please","id":47,"isCustom":false,"note":"Raise hand gently, eye contact.","position":47,"pronunciation":"lah KWEN-tah por fah-VOR","spanish":"La cuenta, por favor","status":"known"},{"category":"Food","categoryOrder":5,"english":"It was delicious","id":48,"isCustom":false,"note":"Cooks love hearing this.","position":48,"pronunciation":"es-TOO-vo ing toward the speed.","exampleSpanish":"Voy hacia la velocidad.","gender":"feminine","id":490,"isCustom":false,"plural":"velocidades","position":490,"sourceLabel":"Core 500","spanish":"velocidad","status":"new"},{"article":"la","category":"Work & study","english":"university","exampleEnglish":"We talk about this university.","exampleSpanish":"Hablamos de esta universidad.","gender":"feminine","id":491,"isCustom":false,"plural":"universidades","position":491,"sourceLabel":"Core 500","spanish":"universidad","status":"new"},{"article":"la","category":"Work & study","english":"homework / task","exampleEnglish":"We talk about this homework.","exampleSpanish":"Hablamos de esta tarea.","gender":"feminine","id":492,"isCustom":false,"plural":"tareas","position":492,"sourceLabel":"Core 500","spanish":"tarea","status":"new"},{"article":"el","category":"Work & study","english":"exam","exampleEnglish":"We talk about this exam.","exampleSpanish":"Hablamos de este examen.","gender":"masculine","id":493,"isCustom":false,"plural":"exámenes","position":493,"sourceLabel":"Core 500","spanish":"examen","status":"new"},{"article":"la","category":"Work & study","english":"lesson","exampleEnglish":"We talk about this lesson.","exampleSpanish":"Hablamos de esta lección.","gender":"feminine","id":494,"isCustom":false,"plural":"lecciones","position":494,"sourceLabel":"Core 500","spanish":"lección","status":"new"},{"article":"el","category":"Work & study","english":"course","exampleEnglish":"We talk about this course.","exampleSpanish":"Hablamos de este curso.","gender":"masculine","id":495,"isCustom":false,"plural":"cursos","position":495,"sourceLabel":"Core 500","spanish":"curso","status":"new"},{"article":"el","category":"Work & study","english":"study / studio","exampleEnglish":"We talk about this study.","exampleSpanish":"Hablamos de este estudio.","gender":"masculine","id":496,"isCustom":false,"plural":"estudios","position":496,"sourceLabel":"Core 500","spanish":"estudio","status":"new"},{"article":"la","category":"Work & study","english":"education","exampleEnglish":"We talk about this education.","exampleSpanish":"Hablamos de esta educación.","gender":"feminine","id":497,"isCustom":false,"plural":"educaciones","position":497,"sourceLabel":"Core 500","spanish":"educación","status":"new"},{"article":"el","category":"Work & study","english":"knowledge","exampleEnglish":"We talk about this knowledge.","exampleSpanish":"Hablamos de este conocimiento.","gender":"masculine","id":498,"isCustom":false,"plural":"conocimientos","position":498,"sourceLabel":"Core 500","spanish":"conocimiento","status":"new"},{"article":"la","category":"Work & study","english":"practice","exampleEnglish":"We talk about this practice.","exampleSpanish":"Hablamos de esta práctica.","gender":"feminine","id":499,"isCustom":false,"plural":"prácticas","position":499,"sourceLabel":"Core 500","spanish":"práctica","status":"new"},{"article":"el","category":"Work & study","english":"project","exampleEnglish":"We talk about this project.","exampleSpanish":"Hablamos de este proyecto.","gender":"masculine","id":500,"isCustom":false,"plural":"proyectos","position":500,"sourceLabel":"Core 500","spanish":"proyecto","status":"new"}]};
  (function () {
    'use strict';
    const deckMeta = {
      phrases: { label: 'Phrase', noun: 'phrases' },
      verbs: { label: 'Verb', noun: 'verbs' },
      adjectives: { label: 'Adjective', noun: 'adjectives' },
      nouns: { label: 'Noun', noun: 'nouns' }
    };
    let activeDeck = 'phrases';
    let activeIndex = 0;
    let flipped = false;
    let searchTerm = '';
    let category = 'all';
    const learned = new Set();
    const order = {};
    let toastTimer = 0;
    let directKey = null;

    Object.keys(DECKS).forEach(function (name) { order[name] = DECKS[name].map(function(c){ return c.id; }); });

    const stage = document.getElementById('stage');
    const actions = document.getElementById('actions');
    const categorySelect = document.getElementById('category');
    const searchInput = document.getElementById('search');
    const progressBar = document.getElementById('progressBar');
    const learnedCount = document.getElementById('learnedCount');
    const pronouns = ['yo','tú','él / ella','nosotros','vosotros','ellos'];

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; });
    }
    function normalize(value) {
      return String(value == null ? '' : value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
    }
    function key(deck, id) { return deck + ':' + id; }
    function fullText(card) { return normalize(JSON.stringify(card)); }
    function deckCategory(card) { return activeDeck === 'verbs' ? card.pattern : card.category; }
    function allCategories() {
      const set = new Set(DECKS[activeDeck].map(deckCategory).filter(Boolean));
      return Array.from(set).sort(function(a,b){ return String(a).localeCompare(String(b)); });
    }
    function updateCategories() {
      const options = ['<option value="all">All categories</option>'].concat(allCategories().map(function(c){ return '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>'; }));
      categorySelect.innerHTML = options.join('');
      categorySelect.value = category;
    }
    function visibleCards() {
      const byId = new Map(DECKS[activeDeck].map(function(c){ return [c.id,c]; }));
      return order[activeDeck].map(function(id){ return byId.get(id); }).filter(function(card){
        if (!card) return false;
        const isDirect = directKey === key(activeDeck, card.id);
        if (learned.has(key(activeDeck, card.id)) && !isDirect) return false;
        if (category !== 'all' && deckCategory(card) !== category && !isDirect) return false;
        if (searchTerm && fullText(card).indexOf(normalize(searchTerm)) < 0 && !isDirect) return false;
        return true;
      });
    }
    function spanishFor(card) {
      if (activeDeck === 'phrases') return card.spanish;
      if (activeDeck === 'verbs') return card.infinitive;
      if (activeDeck === 'adjectives') return card.lemma;
      return [card.article, card.spanish].filter(Boolean).join(' ');
    }
    function englishFor(card) { return card.english; }
    function audioButton(card, slow) {
      const title = slow ? 'Play slower pronunciation' : 'Play pronunciation';
      const label = slow ? 'Slower' : 'Listen';
      return '<button class="audio-btn" type="button" data-speech="'+escapeHtml(spanishFor(card))+'" data-rate="'+(slow ? '.7' : '1')+'" aria-label="'+title+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a8.5 8.5 0 0 1 0 12"></path></svg>'+label+'</button>';
    }

    const lookup = new Map();
    function addLookup(term, deck, id) {
      const n = normalize(term).replace(/^[^a-zñ]+|[^a-zñ]+$/g,'');
      if (n.length < 2 || lookup.has(n)) return;
      lookup.set(n, { deck: deck, id: id });
    }
    DECKS.verbs.forEach(function(c){
      addLookup(c.infinitive,'verbs',c.id);
      ['present','preterite','future'].forEach(function(t){ (c[t] || []).forEach(function(v){ addLookup(v,'verbs',c.id); }); });
    });
    DECKS.adjectives.forEach(function(c){ [c.lemma,c.feminine,c.masculinePlural,c.femininePlural].forEach(function(v){ addLookup(v,'adjectives',c.id); }); });
    DECKS.nouns.forEach(function(c){ [c.spanish,c.plural].forEach(function(v){ addLookup(v,'nouns',c.id); }); });

    function linkedText(text, ownDeck, ownId) {
      return escapeHtml(text).split(/(\s+)/).map(function(piece){
        if (/^\s+$/.test(piece)) return piece;
        const bare = normalize(piece).replace(/^[^a-zñ]+|[^a-zñ]+$/g,'');
        const hit = lookup.get(bare);
        if (!hit || (hit.deck === ownDeck && hit.id === ownId)) return piece;
        const prefix = piece.match(/^[^\p{L}]*/u)[0];
        const suffix = piece.match(/[^\p{L}]*$/u)[0];
        const middle = piece.slice(prefix.length, piece.length - suffix.length || undefined);
        return escapeHtml(prefix) + '<button class="word-link" type="button" data-jump-deck="'+hit.deck+'" data-jump-id="'+hit.id+'" aria-label="Open '+escapeHtml(middle)+' in '+hit.deck+'">'+escapeHtml(middle)+'</button>' + escapeHtml(suffix);
      }).join('');
    }

    function detailsHtml(card) {
      if (activeDeck === 'phrases') {
        return (card.pronunciation ? '<p class="spanish-back">'+escapeHtml(card.pronunciation)+'</p>' : '') +
          (card.note ? '<div class="note">'+linkedText(card.note,'phrases',card.id)+'</div>' : '');
      }
      if (activeDeck === 'verbs') {
        return '<p class="spanish-back">'+escapeHtml(card.pattern || '')+'</p><div class="conjugations">'+[
          ['Present',card.present],['Past · preterite',card.preterite],['Future',card.future]
        ].map(function(group){ return '<section class="tense"><h3>'+group[0]+'</h3><ol>'+group[1].map(function(v,i){ return '<li><span class="pronoun">'+pronouns[i]+'</span><span>'+escapeHtml(v)+'</span></li>'; }).join('')+'</ol></section>'; }).join('')+'</div>';
      }
      if (activeDeck === 'adjectives') {
        return '<div class="forms"><div class="form-cell"><small>Feminine</small>'+escapeHtml(card.feminine)+'</div><div class="form-cell"><small>Masculine plural</small>'+escapeHtml(card.masculinePlural)+'</div><div class="form-cell"><small>Feminine plural</small>'+escapeHtml(card.femininePlural)+'</div></div>' +
          '<div class="example"><strong>'+linkedText(card.exampleSpanish,'adjectives',card.id)+'</strong>'+escapeHtml(card.exampleEnglish)+'</div>';
      }
      return '<p class="spanish-back">'+escapeHtml(card.gender)+' · plural: '+escapeHtml(card.plural)+'</p>' +
        '<div class="example"><strong>'+linkedText(card.exampleSpanish,'nouns',card.id)+'</strong>'+escapeHtml(card.exampleEnglish)+'</div>';
    }

    function cardHtml(card, count) {
      const frontSpanish = linkedText(spanishFor(card), activeDeck, card.id);
      const phraseClass = activeDeck === 'phrases' ? ' phrase-word' : '';
      return '<div id="studyCard" class="card'+(flipped?' flipped':'')+'" aria-label="Flashcard. '+(flipped?'Showing answer.':'Showing Spanish. Tap to reveal answer.')+'">' +
        '<article class="face front"'+(flipped?' inert':'')+'><div class="card-top"><span class="deck-label">'+deckMeta[activeDeck].label+(deckCategory(card)?' · '+escapeHtml(deckCategory(card)):'')+'</span><span class="position">'+(activeIndex+1)+' / '+count+'</span></div>'+
        '<div class="word-wrap"><h2 class="word'+phraseClass+'">'+frontSpanish+'</h2><div class="audio-row">'+audioButton(card,false)+audioButton(card,true)+'</div><button class="hint" type="button" data-flip="true">Tap anywhere to reveal the answer</button></div></article>'+
        '<article class="face back"'+(!flipped?' inert':'')+'><div class="card-top"><span class="deck-label">'+deckMeta[activeDeck].label+'</span><span class="position">'+(activeIndex+1)+' / '+count+'</span></div>'+
        '<div class="details"><h2 class="meaning">'+escapeHtml(englishFor(card))+'</h2><p class="spanish-back">'+linkedText(spanishFor(card), activeDeck, card.id)+'</p>'+detailsHtml(card)+'<div class="audio-row">'+audioButton(card,false)+audioButton(card,true)+'</div></div></article></div>';
    }

    function render() {
      const cards = visibleCards();
      if (activeIndex >= cards.length) activeIndex = 0;
      learnedCount.textContent = learned.size + ' learned';
      const total = DECKS[activeDeck].length;
      const deckLearned = DECKS[activeDeck].filter(function(c){ return learned.has(key(activeDeck,c.id)); }).length;
      progressBar.style.width = (deckLearned / total * 100) + '%';
      if (!cards.length) {
        actions.hidden = true;
        const filtered = !!searchTerm || category !== 'all';
        stage.innerHTML = '<div class="empty"><h2>'+(filtered?'No matching cards':'Deck complete')+'</h2><p>'+(filtered?'Try a different search or category.':'You marked every '+deckMeta[activeDeck].noun+' card as learned this session.')+'</p><button class="reset" type="button" data-reset="'+(filtered?'filters':'deck')+'">'+(filtered?'Clear filters':'Study again')+'</button></div>';
        return;
      }
      actions.hidden = false;
      const card = cards[activeIndex];
      stage.innerHTML = cardHtml(card,cards.length);
    }

    function moveNext(markLearned) {
      const cards = visibleCards();
      if (!cards.length) return;
      const card = cards[activeIndex];
      directKey = null;
      if (markLearned) {
        learned.add(key(activeDeck,card.id));
        showToast('Marked learned');
      } else {
        const ids = order[activeDeck];
        const pos = ids.indexOf(card.id);
        if (pos >= 0) ids.push(ids.splice(pos,1)[0]);
        showToast('Moved to the end');
      }
      flipped = false;
      render();
    }
    function showToast(message) {
      const t = document.getElementById('toast');
      t.textContent = message; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); },1300);
    }
    function playSpeech(text, rate) {
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        showToast('Speech is not supported in this browser');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = Number(rate) || 1;
      const voices = window.speechSynthesis.getVoices();
      const spanishVoice = voices.find(function(voice){ return /^es-ES$/i.test(voice.lang); }) ||
        voices.find(function(voice){ return /^es(-|_)/i.test(voice.lang); });
      if (spanishVoice) utterance.voice = spanishVoice;
      utterance.onerror = function(){ showToast('Pronunciation could not play'); };
      window.speechSynthesis.speak(utterance);
    }
    function switchDeck(deck) {
      activeDeck = deck; activeIndex = 0; flipped = false; category = 'all'; directKey = null;
      document.querySelectorAll('.tab').forEach(function(tab){ tab.setAttribute('aria-selected',String(tab.dataset.deck === deck)); });
      updateCategories(); render();
    }
    function jumpTo(deck,id) {
      const target = DECKS[deck].find(function(c){ return c.id === Number(id); });
      if (!target) return;
      activeDeck = deck; category = 'all'; searchTerm = ''; searchInput.value = ''; flipped = false;
      directKey = key(deck,target.id);
      const ids = order[deck]; const pos = ids.indexOf(target.id); if (pos > 0) ids.unshift(ids.splice(pos,1)[0]);
      activeIndex = 0;
      document.querySelectorAll('.tab').forEach(function(tab){ tab.setAttribute('aria-selected',String(tab.dataset.deck === deck)); });
      updateCategories(); render(); showToast('Opened in '+deck);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    document.querySelector('.tabs').addEventListener('click',function(e){ const tab=e.target.closest('.tab'); if(tab) switchDeck(tab.dataset.deck); });
    searchInput.addEventListener('input',function(){ searchTerm=this.value; activeIndex=0; flipped=false; directKey=null; render(); });
    categorySelect.addEventListener('change',function(){ category=this.value; activeIndex=0; flipped=false; directKey=null; render(); });
    document.getElementById('shuffle').addEventListener('click',function(){
      const a=order[activeDeck]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      activeIndex=0; flipped=false; directKey=null; render(); showToast('Deck shuffled');
    });
    document.getElementById('again').addEventListener('click',function(){ moveNext(false); });
    document.getElementById('got').addEventListener('click',function(){ moveNext(true); });
    stage.addEventListener('click',function(e){
      const speech=e.target.closest('[data-speech]'); if(speech){ e.preventDefault(); e.stopPropagation(); playSpeech(speech.dataset.speech,speech.dataset.rate); return; }
      const jump=e.target.closest('[data-jump-deck]'); if(jump){ e.preventDefault(); e.stopPropagation(); jumpTo(jump.dataset.jumpDeck,jump.dataset.jumpId); return; }
      const reset=e.target.closest('[data-reset]'); if(reset){ if(reset.dataset.reset==='filters'){ searchTerm=''; searchInput.value=''; category='all'; updateCategories(); } else { DECKS[activeDeck].forEach(function(c){ learned.delete(key(activeDeck,c.id)); }); } activeIndex=0; render(); return; }
      if(e.target.closest('[data-flip]') || e.target.closest('#studyCard')){ flipped=!flipped; render(); }
    });
    document.addEventListener('keydown',function(e){
      if(e.target.matches('input,select,button')) return;
      if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); flipped=!flipped; render(); }
      if(e.key==='ArrowLeft') moveNext(false);
      if(e.key==='ArrowRight') moveNext(true);
    });

    updateCategories(); render();
  })();
  </script>
